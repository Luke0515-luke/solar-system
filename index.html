<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>html,body{margin:0}</style>
<title>太陽系模擬器</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+TC:wght@400;500;700&family=Space+Grotesk:wght@500;700&display=swap">
<style>
/* Layout: full-bleed 3D stage; instrument panels float along the edges (info right, layers left, clock bottom). */
:root {
  --bg: #050812;
  --panel: rgba(9, 15, 31, 0.84);
  --panel-solid: #0a1022;
  --line: #27345a;
  --line-soft: #1a2442;
  --fg: #e9eef9;
  --muted: #8e9bbd;
  --accent: #f4b94f;
  --accent-ink: #1a1204;
  --cool: #7fc6ff;
  --font-ui: 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', system-ui, sans-serif;
  --font-display: 'Space Grotesk', 'Noto Sans TC', system-ui, sans-serif;
  --font-mono: 'IBM Plex Mono', ui-monospace, Menlo, Consolas, monospace;
  color-scheme: dark;
}
html, body { height: 100%; }
body { background: var(--bg); color: var(--fg); font: 14px/1.5 var(--font-ui); overflow: hidden; }
#app { position: relative; width: 100%; height: 100%; overflow: hidden; background: var(--bg); }
#gl { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; outline: none; }
#labels { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
#fail { position: absolute; inset: 0; pointer-events: none; display: grid; place-items: center; padding: 24px; text-align: center; color: var(--muted); }

[hidden] { display: none !important; }
button, input { font: inherit; color: inherit; }
[hidden] { display: none !important; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.tag { position: absolute; left: 0; top: 0; display: flex; align-items: center; gap: 6px; margin: -4px 0 0 -4px; white-space: nowrap; will-change: transform; }
.tag i { width: 8px; height: 8px; border-radius: 50%; flex: none; box-shadow: 0 0 0 1px rgba(5, 8, 18, 0.7); }
.tag span { font-size: 12px; color: var(--fg); text-shadow: 0 1px 3px #000, 0 0 6px #000; }
.tag.moon i { width: 6px; height: 6px; margin: 1px; }
.tag.moon span { font-size: 11px; color: #c7d2ea; }
.tag.on span { color: var(--accent); font-weight: 700; }
#labels.nolabels .tag span { display: none; }

.topbar { position: absolute; top: 16px; left: max(16px, env(safe-area-inset-left, 0px)); right: max(16px, env(safe-area-inset-right, 0px)); display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; pointer-events: none; z-index: 5; }
.topbar > * { pointer-events: auto; }
.brand h1 { margin: 0; font: 700 18px/1.2 var(--font-display); letter-spacing: 0.02em; }
.brand p { margin: 2px 0 0; font-size: 12px; color: var(--muted); }
.tools { display: flex; gap: 8px; align-items: flex-start; }

.btn { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 7px 12px; min-height: 36px; line-height: 1.2; backdrop-filter: blur(6px); }
.btn:hover { border-color: var(--muted); }
.btn[aria-pressed="true"], .btn[aria-expanded="true"] { border-color: var(--accent); color: var(--accent); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 700; }

.search { position: relative; }
.search input { width: 150px; min-height: 36px; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 6px 10px; backdrop-filter: blur(6px); transition: width 0.15s; }
.search input:focus { width: min(260px, 60vw); outline: none; border-color: var(--accent); }
.search input::placeholder { color: var(--muted); }
#results { position: absolute; top: 40px; right: 0; width: min(280px, 80vw); margin: 0; padding: 4px; list-style: none; background: var(--panel-solid); border: 1px solid var(--line); border-radius: 6px; max-height: 50vh; overflow: auto; }
#results button { width: 100%; display: flex; justify-content: space-between; gap: 10px; align-items: baseline; text-align: left; background: none; border: 0; border-radius: 4px; padding: 7px 8px; }
#results button:hover, #results button:focus-visible { background: var(--line-soft); }
#results small { color: var(--muted); font-family: var(--font-mono); font-size: 11px; }

.panel { position: absolute; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; backdrop-filter: blur(8px); z-index: 4; overflow: auto; }
#layers { top: 64px; left: max(16px, env(safe-area-inset-left, 0px)); width: 250px; padding: 14px; z-index: 6; }
#layers h2, #info h2 { margin: 0; }
.group { display: grid; gap: 10px; }
.group + .group { margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--line-soft); }
.group h3 { margin: 0; font: 500 11px/1 var(--font-mono); letter-spacing: 0.08em; color: var(--muted); text-transform: uppercase; }
.check, .radio { display: flex; align-items: center; gap: 10px; cursor: pointer; }
.check input, .radio input { accent-color: var(--accent); width: 16px; height: 16px; margin: 0; }
.slider { display: grid; gap: 4px; }
.slider label { display: flex; justify-content: space-between; color: var(--muted); font-size: 13px; }
input[type=range] { width: 100%; accent-color: var(--accent); }
.note { margin: 0; font-size: 12px; color: var(--muted); }

#info { top: 64px; right: max(16px, env(safe-area-inset-right, 0px)); width: 300px; max-height: calc(100% - 64px - 132px); padding: 16px; }
#info .head { display: flex; justify-content: space-between; gap: 8px; align-items: flex-start; }
#info .zh { font: 700 24px/1.15 var(--font-display); }
#info .en { margin-top: 2px; font: 400 12px/1.3 var(--font-mono); color: var(--muted); }
.pill { display: inline-block; margin-top: 8px; padding: 2px 8px; border: 1px solid var(--line); border-radius: 99px; font-size: 12px; color: var(--cool); }
.pill.warn { color: var(--accent); }
.x { background: none; border: 0; width: 32px; height: 32px; border-radius: 6px; color: var(--muted); font-size: 18px; line-height: 1; margin: -6px -8px 0 0; }
.x:hover { color: var(--fg); background: var(--line-soft); }
dl.facts { display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; margin: 14px 0 0; }
dl.facts dt { color: var(--muted); font-size: 13px; }
dl.facts dd { margin: 0; text-align: right; font: 400 13px/1.5 var(--font-mono); font-variant-numeric: tabular-nums; min-width: 0; overflow-wrap: anywhere; }
.chips-title { margin: 16px 0 8px; font: 500 11px/1 var(--font-mono); letter-spacing: 0.08em; color: var(--muted); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { background: none; border: 1px solid var(--line); border-radius: 99px; padding: 3px 10px; font-size: 12px; }
.chip:hover { border-color: var(--accent); color: var(--accent); }
.chip.irr { color: var(--muted); border-style: dashed; }

.timebar { position: absolute; left: max(16px, env(safe-area-inset-left, 0px)); right: max(16px, env(safe-area-inset-right, 0px)); bottom: 16px; z-index: 5; display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 8px 14px; margin: 0 auto; width: fit-content; max-width: calc(100% - 0px); padding: 10px 14px; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; backdrop-filter: blur(8px); }
.clock { display: flex; flex-direction: column; min-width: 0; }
.clock b { font: 500 15px/1.3 var(--font-mono); font-variant-numeric: tabular-nums; }
.clock small { font-size: 12px; color: var(--muted); }
.controls { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; min-width: 0; }
.controls input[type=range] { width: 130px; }

.toast { position: absolute; left: 50%; bottom: 96px; transform: translateX(-50%); max-width: calc(100% - 32px); padding: 6px 12px; background: var(--panel); border: 1px solid var(--line); border-radius: 99px; color: var(--muted); font-size: 12px; text-align: center; pointer-events: none; transition: opacity 0.6s; z-index: 3; }
.toast.gone { opacity: 0; }

@media (max-width: 640px) {
  .brand p { display: none; }
  #info { left: max(16px, env(safe-area-inset-left, 0px)); right: max(16px, env(safe-area-inset-right, 0px)); width: auto; top: auto; bottom: 132px; max-height: 38%; }
  #layers { right: max(16px, env(safe-area-inset-right, 0px)); width: auto; max-height: 52%; }
  .timebar { width: auto; justify-content: space-between; }
  .controls input[type=range] { width: 100px; }
  .toast { bottom: 148px; }
}
@media (prefers-reduced-motion: reduce) {
  .toast, .search input { transition: none; }
}
</style>

</head>
<body>
<div id="app">
  <canvas id="gl" tabindex="0" aria-label="3D 太陽系，可拖曳旋轉、滾輪縮放、點選天體"></canvas>
  <div id="labels" aria-hidden="true"></div>
  <div id="fail" hidden>無法載入 3D 引擎 (three.js)。請確認網路能連到 cdnjs.cloudflare.com、cdn.jsdelivr.net 或 unpkg.com，並暫時關閉擋廣告或內容過濾的外掛後重新整理。</div>

  <div class="topbar">
    <div class="brand">
      <h1>太陽系模擬器</h1>
      <p>拖曳旋轉・滾輪對準天體放大・點選天體</p>
    </div>
    <div class="tools">
      <button class="btn" id="btnLayers" aria-expanded="false" aria-controls="layers">圖層</button>
      <div class="search">
        <input id="q" type="search" placeholder="搜尋天體" autocomplete="off" aria-label="搜尋天體">
        <ul id="results" hidden></ul>
      </div>
    </div>
  </div>

  <aside id="layers" class="panel" hidden aria-label="圖層設定">
    <div class="group">
      <h3>顯示</h3>
      <label class="check"><input type="checkbox" id="optPlanetOrbits" checked>行星與矮行星軌道</label>
      <label class="check"><input type="checkbox" id="optMoonOrbits" checked>衛星軌道</label>
      <label class="check"><input type="checkbox" id="optIrr" checked>不規則衛星</label>
      <label class="check"><input type="checkbox" id="optLabels" checked>名稱標籤</label>
      <label class="check"><input type="checkbox" id="optBelt" checked>小行星帶</label>
    </div>
    <div class="group">
      <h3>行星間距</h3>
      <label class="radio"><input type="radio" name="dist" value="comp" checked>壓縮（內外行星都看得清楚）</label>
      <label class="radio"><input type="radio" name="dist" value="lin">線性（與 AU 成正比）</label>
    </div>
    <div class="group">
      <h3>衛星軌道</h3>
      <div class="slider">
        <label for="moonScale"><span>展開程度</span><span id="moonScaleVal">1.0×</span></label>
        <input type="range" id="moonScale" min="0.4" max="2" step="0.05" value="1">
      </div>
      <p class="note">天體大小與衛星距離為了看得見而放大、壓縮，軌道形狀與傾角則依實際參數繪製。</p>
    </div>
  </aside>

  <section id="info" class="panel" hidden aria-live="polite"></section>

  <div class="toast" id="toast">點選任一天體即可飛過去；按「特寫」或 + / − 可再放大縮小</div>

  <footer class="timebar">
    <div class="clock">
      <b id="dateReadout">—</b>
      <small id="speedLabel">—</small>
    </div>
    <div class="controls">
      <button class="btn primary" id="btnPlay">暫停</button>
      <button class="btn" id="btnRev" aria-pressed="false">反向</button>
      <input type="range" id="speed" min="0" max="7" step="1" value="5" aria-label="模擬速度">
      <button class="btn" id="btnNow">現在</button>
      <button class="btn" id="btnHome">全景</button>
      <button class="btn" id="btnZoomOut" aria-label="縮小">－</button>
      <button class="btn" id="btnZoomIn" aria-label="放大">＋</button>
      <button class="btn" id="btnClose" title="快捷鍵 C">特寫</button>
    </div>
  </footer>
</div>

<script>
(function () {
'use strict';
function boot() {

/* ---------- constants & helpers ---------- */
var D2R = Math.PI / 180, TAU = Math.PI * 2;
var J2000_MS = Date.UTC(2000, 0, 1, 12, 0, 0);
function nowDays() { return (Date.now() - J2000_MS) / 86400000; }
function clamp(x, a, b) { return Math.max(a, Math.min(b, x)); }
function nf(x, d) { d = d || 0; return x.toLocaleString('zh-TW', { minimumFractionDigits: d, maximumFractionDigits: d }); }
function rngFrom(str) {
  var h = 1779033703 ^ str.length;
  for (var i = 0; i < str.length; i++) { h = Math.imul(h ^ str.charCodeAt(i), 3432918353); h = (h << 13) | (h >>> 19); }
  var s = h >>> 0;
  return function () { s = (s + 0x6D2B79F5) >>> 0; var t = Math.imul(s ^ (s >>> 15), 1 | s); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
}
function kepler(M, e) {
  M = ((M % TAU) + TAU) % TAU;
  var E = e < 0.8 ? M : Math.PI;
  for (var k = 0; k < 12; k++) { E -= (E - e * Math.sin(E) - M) / (1 - e * Math.cos(E)); }
  return E;
}
/* position in the orbit's reference frame (Z = pole), same unit as a */
function orbitVec(a, e, iDeg, omDeg, wDeg, E) {
  var x = a * (Math.cos(E) - e), y = a * Math.sqrt(1 - e * e) * Math.sin(E);
  var i = iDeg * D2R, O = omDeg * D2R, w = wDeg * D2R;
  var cw = Math.cos(w), sw = Math.sin(w), cO = Math.cos(O), sO = Math.sin(O), ci = Math.cos(i), si = Math.sin(i);
  return [
    x * (cw * cO - sw * sO * ci) - y * (sw * cO + cw * sO * ci),
    x * (cw * sO + sw * cO * ci) - y * (sw * sO - cw * cO * ci),
    x * (sw * si) + y * (cw * si)

/* ---------- procedural textures (no external images) ---------- */
function hash(x, y) {
  var h = Math.imul(x, 374761393) + Math.imul(y, 668265263);
  h = Math.imul(h ^ (h >>> 13), 1274126177);
  return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
}
function vnoise(x, y, px) {
  var xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi;
  var x0 = ((xi % px) + px) % px, x1 = (x0 + 1) % px;
  var a = hash(x0, yi), b = hash(x1, yi), c = hash(x0, yi + 1), d = hash(x1, yi + 1);
  var u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);

}
function fbm(u, v, base, oct) {
  var s = 0, amp = 0.5, tot = 0;
  for (var o = 0; o < oct; o++) { var f = base * (1 << o); s += amp * vnoise(u * f, v * f * 0.5, f); tot += amp; amp *= 0.5; }

}
function mix(a, b, t) { t = clamp(t, 0, 1); return [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t]; }
function paint(w, h, fn) {
  var c = document.createElement('canvas'); c.width = w; c.height = h;

    var col = fn(x / w, y / h), p = (y * w + x) * 4;
    im.data[p] = col[0]; im.data[p + 1] = col[1]; im.data[p + 2] = col[2]; im.data[p + 3] = 255;

  t.anisotropy = Math.min(8, renderer.capabilities.getMaxAnisotropy());
  queueHiRes(t, fn);
  return t;
}
/* 高解析貼圖：分批在背景繪製（每次約 5ms），不會讓畫面卡住；完成後自動替換 */
var HI_W = 1024, HI_H = 512, hiJobs = [], hiRunning = false;
function queueHiRes(t, fn) {
  var job = { tex: t, fn: fn, c: null, g: null, im: null, y: 0 };
  t._job = job; hiJobs.push(job);
  if (!hiRunning) { hiRunning = true; setTimeout(hiTick, 50); }
}
function prioritize(t) {
  var j = t && t._job; if (!j) return;
  var i = hiJobs.indexOf(j); if (i > 0) { hiJobs.splice(i, 1); hiJobs.unshift(j); }
}
function hiTick() {
  var job = hiJobs[0];
  if (!job) { hiRunning = false; return; }
  if (!job.c) {
    job.c = document.createElement('canvas'); job.c.width = HI_W; job.c.height = HI_H;
    job.g = job.c.getContext('2d'); job.im = job.g.createImageData(HI_W, HI_H);
  }
  var t0 = performance.now(), d = job.im.data;
  while (job.y < HI_H && performance.now() - t0 < 5) {
    var y = job.y;
    for (var x = 0; x < HI_W; x++) {
      var col = job.fn(x / HI_W, y / HI_H), q = (y * HI_W + x) * 4;
      d[q] = col[0]; d[q + 1] = col[1]; d[q + 2] = col[2]; d[q + 3] = 255;

    job.y++;

    job.g.putImageData(job.im, 0, 0);

  }

function rockTex(c1, c2, base) {
  return paint(256, 128, function (u, v) {
    var n = fbm(u, v, base || 6, 5), crat = fbm(u + 0.2, v, 22, 2);

function gasTex(pal, bands, turb) {
  return paint(256, 128, function (u, v) {
    var n = fbm(u, v, 5, 4);
    var b = Math.sin((v * bands + (n - 0.5) * turb) * TAU) * 0.5 + 0.5;

function earthTex() {
  return paint(256, 128, function (u, v) {
    var n = fbm(u, v, 4, 6), lat = Math.abs(v - 0.5) * 2, c;

function marsTex() {
  return paint(256, 128, function (u, v) {
    var n = fbm(u, v, 5, 5), lat = Math.abs(v - 0.5) * 2;

var TEX = {};
function tex(name) {
  if (TEX[name]) return TEX[name];
  var t;
  switch (name) {
    case 'sun': t = rockTex([226, 104, 16], [255, 214, 96], 5); break;
    case 'mercury': t = rockTex([84, 82, 80], [176, 170, 164], 7); break;

    case 'mars': t = marsTex(); break;
    case 'jupiter': t = gasTex([[196, 150, 112], [236, 216, 182], [164, 104, 66], [226, 196, 150], [138, 88, 58]], 7, 1.4); break;
    case 'saturn': t = gasTex([[224, 198, 146], [204, 178, 128], [236, 216, 170]], 6, 0.6); break;
    case 'uranus': t = gasTex([[150, 214, 224], [168, 228, 234]], 3, 0.3); break;
    case 'neptune': t = gasTex([[44, 84, 196], [70, 120, 226], [38, 72, 168]], 4, 0.8); break;

function glowTex() {
  var c = document.createElement('canvas'); c.width = c.height = 256;
  var g = c.getContext('2d'), gr = g.createRadialGradient(128, 128, 0, 128, 128, 128);

  var g = c.getContext('2d'), im = g.createImageData(w, 2);

var last = performance.now(), lastInfo = 0, rebuildQueued = false;
function frame(now) {
  var dt = Math.min(0.1, (now - last) / 1000); last = now;
  if (S.playing) S.t += S.dir * SPEEDS[S.speed] * dt;
  updateBodies(dt);
  scene.updateMatrixWorld(true);

  worldPos(follow, tmpT);
  tmpO.copy(camera.position).sub(controls.target);
  var dist = tmpO.length(), target = tmpT;
  if (fly) {
    fly.t = Math.min(1, fly.t + dt / 1.3);
    var k = 1 - Math.pow(1 - fly.t, 3);

    target = tmpD.copy(fly.from).lerp(tmpT, k);
    if (fly.toDir) tmpO.copy(fly.fromDir).lerp(fly.toDir, k);

  tmpO.normalize().multiplyScalar(dist);
  controls.target.copy(target);
  camera.position.copy(target).add(tmpO);
  controls.update();
  camera.near = Math.max(0.01, camera.position.distanceTo(controls.target) * 0.004);
  camera.updateProjectionMatrix();
  stars.position.copy(camera.position);

  updateOverlay();
  document.getElementById('dateReadout').textContent = fmtDate(S.t);

/* load three.js, trying several CDNs in turn */
var SRC = [
  'https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js',
  'https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js',
  'https://unpkg.com/three@0.128.0/build/three.min.js'
];
function loadThree(i) {
  if (typeof THREE !== 'undefined') { boot(); return; }
  if (i >= SRC.length) { document.getElementById('fail').hidden = false; return; }
  var s = document.createElement('script');
  s.src = SRC[i];
  s.onload = function () { if (typeof THREE !== 'undefined') boot(); else loadThree(i + 1); };
  s.onerror = function () { loadThree(i + 1); };
  document.head.appendChild(s);
}
loadThree(0);
})();
</script>
